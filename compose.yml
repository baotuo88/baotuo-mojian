name: baotuo-mojian

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.example
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ALLOW_LAN: "false"
      TRUSTED_REVERSE_PROXY: "true"
      AI_NOVEL_DATABASE_MODE: postgresql
      AI_NOVEL_COMPOSE_BASELINE: "true"
      IMAGE_STORAGE_DRIVER: local
      IMAGE_STORAGE_ROOT: /app/storage/generated-images
      QDRANT_URL: http://qdrant:6333
    volumes:
      - image_storage:/app/storage/generated-images
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ && wget -q -O /dev/null http://127.0.0.1:8080/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - frontend
      - backend

  qdrant:
    image: qdrant/qdrant:v1.15.4
    profiles: ["rag"]
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

volumes:
  postgres_data:
  image_storage:
  qdrant_storage:

networks:
  frontend:
  backend:
    internal: true
