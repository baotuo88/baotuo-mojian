name: Desktop Beta Package Verification

on:
  workflow_dispatch:
  push:
    branches: [beta]

permissions:
  contents: read

jobs:
  verify-beta-package:
    runs-on: windows-latest
    env:
      AI_NOVEL_RELEASE_CHANNEL: beta
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop icon tooling
        run: python -m pip install --disable-pip-version-check pillow

      - name: Regenerate desktop icon assets
        run: python desktop/scripts/generate-desktop-icons.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify desktop staging configuration
        run: node --test desktop/tests/stagingConfig.test.cjs

      - name: Build and stage desktop app
        run: pnpm stage:desktop

      - name: Verify packaged desktop layout
        run: pnpm verify:desktop-package:reuse-stage

      - name: Verify installer construction
        run: pnpm verify:desktop:installer
